name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AutoClicker v__VERSION__'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## AutoClicker v__VERSION__

            ### 下载说明

            - **`AutoClicker_x.x.x_x64_zh-CN.msi`** — 安装包（推荐，自动处理依赖）
            - **`AutoClicker_x.x.x_x64-setup.exe`** — NSIS 安装程序

            两者都会安装同一应用，任选其一即可。首次运行需要 Windows 10/11 自带的
            **WebView2 运行时**（绝大多数系统已内置；若缺失，安装程序会自动下载）。

            ### 本次重写带来的改进

            - **彻底解决高分屏显示问题**：基于 WebView2 矢量渲染 + Per-Monitor v2 DPI
              感知，文字在任何缩放比例下都锐利清晰，控件随 DPI 自动缩放
            - 现代化的卡片式界面，深色 / 浅色主题自动跟随系统
            - 窗口跨显示器移动时实时重排，不再模糊或错位
          includeUpdaterJson: false
