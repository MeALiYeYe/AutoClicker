name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release x64
      run: msbuild AutoClicker.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

    - name: Build Release Win32
      run: msbuild AutoClicker.sln /p:Configuration=Release /p:Platform=Win32 /m /verbosity:minimal

    - name: Find and copy build outputs
      shell: pwsh
      run: |
        Write-Host "=== Searching for build outputs ==="
        $x64exe = Get-ChildItem -Path . -Recurse -Filter "AutoClicker.exe" | Where-Object { $_.FullName -match "x64" }
        $x86exe = Get-ChildItem -Path . -Recurse -Filter "AutoClicker.exe" | Where-Object { $_.FullName -match "Win32" }
        
        Write-Host "x64 exe: $($x64exe.FullName)"
        Write-Host "x86 exe: $($x86exe.FullName)"
        
        New-Item -ItemType Directory -Force -Path release
        if ($x64exe) { Copy-Item $x64exe.FullName release\AutoClicker-x64.exe }
        if ($x86exe) { Copy-Item $x86exe.FullName release\AutoClicker-x86.exe }
        
        Write-Host "=== Release directory ==="
        dir release\

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: AutoClicker-build
        path: release\*.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/AutoClicker-x64.exe
          release/AutoClicker-x86.exe
        name: AutoClicker ${{ github.ref_name }}
        body: |
          ## AutoClicker ${{ github.ref_name }}

          ### 下载

          - **AutoClicker-x64.exe** - 64位版本（推荐）
          - **AutoClicker-x86.exe** - 32位版本

          ### 功能

          - 多种点击模式（左键/右键/中键/双击/滚轮）
          - 多坐标点独立间隔点击
          - 固定/随机偏移频率
          - 范围随机抖动
          - 按次数/时长/无限循环
          - 防沉迷定时休息
          - 配置方案保存/加载
          - 全局热键一键启停
          - 系统托盘最小化
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
